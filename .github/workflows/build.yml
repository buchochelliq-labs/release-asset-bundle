name: release-kit build

# Builds the artifacts release-kit.yml declares for the packages a release
# gate selected, from the tagged commit: one job per artifact (and target),
# each on the runner it needs. Every job uploads its files as the artifact
# `release--<package slug>--<job id>`, which the publish actions pick up.
# Building needs no credentials, so this is a reusable workflow; publishing
# stays in the calling repository's own jobs (Trusted Publishing names them).

on:
  workflow_call:
    inputs:
      sha:
        description: The tagged commit (the gate's `sha` output)
        type: string
        required: true
      selection:
        description: The gate's `selection` output
        type: string
        required: true
      kit-ref:
        description: The release-kit version to run; keep it equal to the @ref this workflow is called with
        type: string
        default: v1

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: buchochelliq-labs/release-kit
          ref: ${{ inputs.kit-ref }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - id: plan
        env:
          SELECTION: ${{ inputs.selection }}
        run: python3 .release-kit/scripts/release.py plan --selection "$SELECTION"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: build ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: buchochelliq-labs/release-kit
          ref: ${{ inputs.kit-ref }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.kind == 'rust-binary'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.kind == 'vsix'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.kind == 'maturin'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m ${{ matrix.cargo }}
          manylinux: auto
      - if: matrix.kind == 'maturin-sdist'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m ${{ matrix.cargo }}
      - name: Build ${{ matrix.id }}
        shell: bash
        env:
          JOB: ${{ toJSON(matrix) }}
        run: python3 .release-kit/scripts/release.py build --job "$JOB" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release--${{ matrix.slug }}--${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
