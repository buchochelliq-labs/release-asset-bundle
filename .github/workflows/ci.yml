name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the oldest Python release.py supports
      - name: Unit tests
        run: |
          python3 -m pip install --quiet pyyaml
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          python3 -m unittest discover -s tests -v
      # The template and build workflow use the kit by local path, as an
      # installed copy does: install into a scratch repository and lint there.
      - name: Install into a scratch repository and lint it
        run: |
          pip install -q actionlint-py shellcheck-py pyyaml
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/.github/workflows" && git -C "$consumer" init -q
          printf 'on:\n  workflow_call:\n    inputs:\n      ref: {type: string}\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' \
            > "$consumer/.github/workflows/ci.yml"
          python3 scripts/release.py install --into "$consumer"
          (cd "$consumer" && python3 .github/release-kit/scripts/release.py vendored && actionlint)
          actionlint .github/workflows/*.yml
          python3 tests/extract_scripts.py lint-scripts
          shellcheck -S warning lint-scripts/*.sh
