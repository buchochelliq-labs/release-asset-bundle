# The rab (Release Asset Bundle) documentation site, built with Zensical:
#   pip install zensical && zensical build --strict
# The built site loads no web fonts and no external scripts. With `repo_url`
# the header links the repository, and the reader's browser asks GitHub's API
# for its statistics: the site's one third-party request.
site_name: rab, the Release Asset Bundle
site_description: >-
  rab (formerly release-kit), the buchochelliq-labs release standard: one file
  declares what a repository publishes, one command tags a release, one
  workflow run publishes it.
site_url: https://buchochelliq-labs.github.io/release-asset-bundle/
repo_url: https://github.com/buchochelliq-labs/release-asset-bundle
repo_name: buchochelliq-labs/release-asset-bundle
docs_dir: docs
site_dir: site
copyright: buchochelliq-labs

theme:
  name: material
  font: false
  logo: assets/bab.svg
  favicon: assets/bab.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - rab.yml reference: configuration.md
  - Commands: commands.md
  - The workflow: workflow.md
  - Recovering a failed release: recovery.md
  - The release record: release-record.md
  - Registries:
      - registries/index.md
      - GitHub Releases: registries/github.md
      - crates.io: registries/crates-io.md
      - Publishing to crates.io: registries/publishing-to-crates-io.md
      - PyPI: registries/pypi.md
      - npm: registries/npm.md
      - VS Code Marketplace and Open VSX: registries/vscode.md
      - Homebrew: registries/homebrew.md
      - Chocolatey: registries/chocolatey.md
  - Migrating from release-kit 1.x: migrating-to-rab.md
  - Migrating from rs-rich-cli: migrating-from-rs-rich-cli.md
  - BAB, the mascot: mascot.md
  - Versions and changelog: changelog.md
