name: publish to PyPI
description: >-
  Upload the built distributions with Trusted Publishing (the calling job
  needs `id-token: write` and the PyPI publisher configured for the calling
  workflow), then wait until PyPI serves the version.
inputs:
  selection:
    description: The gate's selection output.
    required: true
  packages-dir:
    description: Directory of the built wheels and sdists.
    default: dist/
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SELECTION: ${{ inputs.selection }}
      run: python3 "$GITHUB_ACTION_PATH/../scripts/release.py" preflight --registry pypi --selection "$SELECTION"
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ inputs.packages-dir }}
    - shell: bash
      env:
        SELECTION: ${{ inputs.selection }}
      run: python3 "$GITHUB_ACTION_PATH/../scripts/release.py" verify --registry pypi --selection "$SELECTION"
