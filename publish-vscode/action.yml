name: publish to the VS Code Marketplace
description: >-
  Publish each selected extension's packaged .vsix (named <name>-<version>.vsix)
  to the Visual Studio Marketplace, and to Open VSX when a token is given;
  then wait until the Marketplace serves the version.
inputs:
  selection:
    description: The gate's selection output.
    required: true
  vsix-dir:
    description: Directory of the packaged .vsix files (vsce package).
    default: dist/
  vsce-token:
    description: A Visual Studio Marketplace personal access token.
    required: true
  ovsx-token:
    description: An Open VSX token; empty skips Open VSX.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SELECTION: ${{ inputs.selection }}
        VSIX_DIR: ${{ inputs.vsix-dir }}
        VSCE_PAT: ${{ inputs.vsce-token }}
        OVSX_PAT: ${{ inputs.ovsx-token }}
      run: |
        set -euo pipefail
        kit="$GITHUB_ACTION_PATH/../scripts/release.py"
        python3 "$kit" preflight --registry vscode --selection "$SELECTION"
        jq -r '.[] | select(.registry == "vscode") | "\(.name)\t\(.version)"' <<<"$SELECTION" |
        while IFS=$'\t' read -r id version; do
          file="$VSIX_DIR/${id#*.}-$version.vsix"
          if [ ! -f "$file" ]; then echo "::error::$file not found (vsce package names it <name>-<version>.vsix)"; exit 1; fi
          npx --yes @vscode/vsce publish --packagePath "$file"
          if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish "$file"; fi
        done
        python3 "$kit" verify --registry vscode --selection "$SELECTION"
