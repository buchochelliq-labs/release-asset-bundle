packages:
  - name: onto-core
    registry: crates.io
    manifest: crates/onto-core/Cargo.toml
    version: "0.1.0"
  - name: onto-ods
    registry: crates.io
    manifest: crates/onto-ods/Cargo.toml
    version: "0.1.0"
  - name: onto
    registry: crates.io
    manifest: crates/onto-cli/Cargo.toml
    version: "0.1.0"
  - name: onto
    registry: github
    manifest: crates/onto-cli/Cargo.toml
    version: "0.1.0"
    tag: "v{version}"
    artifacts: [{kind: rust-binary, bin: onto}]
